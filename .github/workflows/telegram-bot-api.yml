name: Build telegram-bot-api

# Prebuilds the telegram-bot-api binary and publishes it to GHCR so deploys
# never recompile tdlib. The pinned commit lives in the main Dockerfile
# (ARG TGAPI_COMMIT=...); this workflow reads it from there, so that line stays
# the single source of truth. Bumping it (or editing the build files) triggers
# a rebuild; if the tagged image already exists, the build is skipped.

on:
  workflow_dispatch:
  push:
    paths:
      - Dockerfile
      - tgapi.Dockerfile
      - .github/workflows/telegram-bot-api.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve pinned commit and image name
        id: meta
        run: |
          commit=$(grep -oP 'ARG TGAPI_COMMIT=\K[0-9a-fA-F]+' Dockerfile | head -1)
          if [ -z "$commit" ]; then
            echo "Could not find 'ARG TGAPI_COMMIT=<sha>' in Dockerfile" >&2
            exit 1
          fi
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$owner/telegram-bot-api" >> "$GITHUB_OUTPUT"
          echo "Resolved $owner/telegram-bot-api @ $commit"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if image already published
        id: exists
        run: |
          if docker manifest inspect "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.commit }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image already published for this commit; skipping build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Buildx
        if: steps.exists.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: steps.exists.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tgapi.Dockerfile
          build-args: |
            TGAPI_COMMIT=${{ steps.meta.outputs.commit }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.commit }}
            ${{ steps.meta.outputs.image }}:latest
